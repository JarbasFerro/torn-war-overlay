name: Bootstrap canonical userscript

on:
  push:
    paths:
      - '.github/workflows/bootstrap-v0131.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct canonical userscript
        shell: bash
        run: |
          cat .bootstrap/payload-*.txt | tr -d '\n' | base64 -d | bunzip2 > torn-war-overlay.user.js
          echo '77ae2130f032f6ec0f158d43ad70a84477ad27ec859f7df119d14968e5949943  torn-war-overlay.user.js' | sha256sum -c -
          grep -q '^// @version      0.13.1$' torn-war-overlay.user.js

      - name: Commit canonical v0.13.1 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-war-overlay.user.js
          git commit -m 'Publish canonical userscript v0.13.1'
          git push
